name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint python/game_of_life.py
        run: flake8 python/game_of_life.py --max-line-length=100

  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate index.html
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          extra: --ignore JAVA_TOOL_OPTIONS